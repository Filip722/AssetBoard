[project]
name = "assetboard"
version = "0.0.0"
description = "A self-hosted personal finance web app"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14,<2",
    "Babel>=2.16,<3",
    "fastapi>=0.116,<1",
    "Jinja2>=3.1,<4",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<2.1",
    "typer>=0.16,<1",
    "uvicorn>=0.35,<1",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.12,<1",
    "pre-commit>=4,<5",
    "pyright>=1.1,<2",
]
test = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "hypothesis>=6,<7",
    "pyyaml>=6,<7",
    "types-pyyaml>=6,<7",
    "httpx>=0.28,<1",
    "playwright>=1.51,<2",
]

[tool.uv]
default-groups = ["dev", "test"]

[project.scripts]
assetboard = "assetboard.cli:app"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
strict = ["src/assetboard/domain", "src/assetboard/services"]

[tool.pytest.ini_options]
addopts = "--cov=src/assetboard --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]

[tool.coverage.run]
branch = false
source = ["src/assetboard"]

[tool.coverage.report]
show_missing = true
