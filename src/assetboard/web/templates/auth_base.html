<!doctype html>
<html lang="{{ locale }}" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="{% block referrer %}same-origin{% endblock %}">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ static_url(request, 'css/app.css') }}">
  <script src="{{ static_url(request, 'js/theme.js') }}"></script>
</head>
<body class="min-h-full bg-canvas dark:bg-slate-950">
  <main id="main-content" class="flex min-h-screen items-center justify-center px-4 py-10">
    <div class="w-full {% block width %}max-w-md{% endblock %}">
      <p class="mb-6 flex items-center justify-center gap-3">
        <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-accent text-lg font-bold text-white" aria-hidden="true">A</span>
        <span class="text-lg font-semibold tracking-tight">{{ app_name }}</span>
      </p>
      <section class="panel p-6 sm:p-8">
        <h1 class="text-xl font-semibold tracking-tight">{% block heading %}{% endblock %}</h1>
        {% block content %}{% endblock %}
      </section>
    </div>
  </main>
</body>
</html>
