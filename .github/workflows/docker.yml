name: Docker

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
      publish:
        description: Publish the image to GHCR (otherwise build without publishing)
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.tag || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' || inputs.tag != '') }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local smoke image (amd64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: assetboard:ci
          build-args: |
            VERSION=${{ inputs.tag || github.ref_name }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=smoke-amd64
          cache-to: type=gha,scope=smoke-amd64,mode=max

      - name: Smoke-test container, read-only root, readiness, restart, and data persistence
        run: scripts/smoke_container.sh assetboard:ci

      - name: Verify Compose deployment with the built image
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            exit_status=$?
            trap - EXIT
            if [[ $exit_status -ne 0 ]]; then
              ASSETBOARD_IMAGE=assetboard:ci docker compose -p assetboard-ci -f compose.example.yaml logs --no-color || true
            fi
            ASSETBOARD_IMAGE=assetboard:ci docker compose -p assetboard-ci -f compose.example.yaml down -v || true
            exit "$exit_status"
          }
          trap cleanup EXIT
          ASSETBOARD_IMAGE=assetboard:ci ASSETBOARD_HOST_PORT=18000 docker compose -p assetboard-ci -f compose.example.yaml up -d --no-build --wait --wait-timeout 90
          # First run: every page redirects to setup, which asks for the setup token.
          result=$(curl --silent --show-error --output /dev/null --write-out '%{http_code} %{redirect_url}' http://127.0.0.1:18000/)
          test "$result" = "303 http://127.0.0.1:18000/setup"
          curl --fail --silent --show-error http://127.0.0.1:18000/setup | grep -Fq 'name="setup_token"'
          curl --fail --silent --show-error http://127.0.0.1:18000/readyz >/dev/null
          ASSETBOARD_IMAGE=assetboard:ci docker compose -p assetboard-ci -f compose.example.yaml logs --no-color \
            | grep -c 'Generated first-run setup token' | grep -qx 1

  detect-arm64-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.changed.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          changed_files=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          if grep -Eq '^(Dockerfile|\.dockerignore|Makefile|pyproject\.toml|uv\.lock)$' <<< "$changed_files"; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
            echo 'Arm64 build required for changed build inputs.'
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo 'No container build input changes; skipping arm64 build.'
          fi

  arm64-native-smoke:
    needs: detect-arm64-changes
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.tag != '' || (github.event_name == 'pull_request' && needs.detect-arm64-changes.outputs.needed == 'true')) }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build native arm64 smoke image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: assetboard:ci-arm64
          build-args: |
            VERSION=${{ inputs.tag || github.ref_name }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=arm64-smoke
          cache-to: type=gha,scope=arm64-smoke,mode=max
      - name: Smoke-test native arm64 image
        run: scripts/smoke_container.sh assetboard:ci-arm64

  publish:
    needs: [smoke, arm64-native-smoke]
    if: ${{ !cancelled() && needs.smoke.result == 'success' && needs.arm64-native-smoke.result == 'success' && (github.event_name == 'push' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize GHCR image name
        id: image-name
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract release Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image-name.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }},enable=${{ !contains(inputs.tag || github.ref_name, '-') }}
            type=semver,pattern={{major}},value=${{ inputs.tag || github.ref_name }},enable=${{ !contains(inputs.tag || github.ref_name, '-') && !startsWith(inputs.tag || github.ref_name, 'v0.') }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag || github.ref_name, '-') }}

      - name: Build and push multi-arch release image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.tag || github.ref_name }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            REVISION=${{ github.sha }}
          cache-from: |
            type=gha,scope=smoke-amd64
            type=gha,scope=arm64-smoke
            type=gha,scope=arm64-pr
          cache-to: type=gha,scope=publish,mode=max

      - name: Record published tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            if [[ '${{ github.event_name }}' == 'workflow_dispatch' && '${{ inputs.publish }}' != 'true' ]]; then
              echo 'Built without publishing; these are the release tags that would be used:'
            else
              echo 'Published image tags:'
            fi
            echo '```text'
            echo "$IMAGE_TAGS"
            echo '```'
            echo 'Platforms: linux/amd64, linux/arm64'
          } >> "$GITHUB_STEP_SUMMARY"
