services:
  assetboard:
    image: ${ASSETBOARD_IMAGE:-assetboard:local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Bind to loopback when a local reverse proxy publishes the public endpoint.
      - "${ASSETBOARD_BIND_ADDRESS:-127.0.0.1}:${ASSETBOARD_HOST_PORT:-8000}:8000"
    environment:
      ASSETBOARD_ENV: prod
      ASSETBOARD_DATA_DIR: /data
      ASSETBOARD_BASE_URL: ${ASSETBOARD_BASE_URL:-http://localhost:8000}
      ASSETBOARD_DEFAULT_LOCALE: ${ASSETBOARD_DEFAULT_LOCALE:-en}
      ASSETBOARD_DEFAULT_CURRENCY: ${ASSETBOARD_DEFAULT_CURRENCY:-EUR}
      ASSETBOARD_LOG_FORMAT: ${ASSETBOARD_LOG_FORMAT:-json}
      # Your reverse proxy's IP or CIDR. Empty trusts no proxy; see docs/deployment.md.
      ASSETBOARD_TRUSTED_PROXIES: ${ASSETBOARD_TRUSTED_PROXIES:-}
      ASSETBOARD_AUTO_MIGRATE: "true"
    volumes:
      - assetboard-data:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Uncomment and configure for Traefik:
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.assetboard.rule=Host(`finance.example.com`)
    #   - traefik.http.routers.assetboard.entrypoints=websecure
    #   - traefik.http.routers.assetboard.tls=true
    #   - traefik.http.services.assetboard.loadbalancer.server.port=8000
    # Or use Caddy with a host rule in your Caddyfile:
    # finance.example.com {
    #     reverse_proxy assetboard:8000
    # }

volumes:
  assetboard-data:
